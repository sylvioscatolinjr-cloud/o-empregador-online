<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisão da interface — homologação OEO</title><style>body{font:16px system-ui;margin:24px;background:#f6f3f9;color:#2c2138}label{display:block;margin:12px 0}select{font:inherit;padding:8px}iframe{display:block;width:375px;height:820px;max-width:100%;border:1px solid #bbb;background:white}h1{font-size:24px}</style></head><body><h1>Revisão da interface de homologação</h1><p>Teste do layout em larguras estreitas. Não substitui o teste em aparelho físico.</p><label for="width">Largura da tela<select id="width"><option value="320">320 px</option><option value="375" selected>375 px</option><option value="390">390 px</option><option value="768">768 px</option></select></label><iframe id="review-frame" title="Assistente na largura selecionada" src="/assistente.html"></iframe><script>document.querySelector('#width').addEventListener('change',event=>{document.querySelector('#review-frame').style.width=event.target.value+'px';});</script></body></html>
