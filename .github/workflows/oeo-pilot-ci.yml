name: OEO pilot tests
on:
  push:
    branches: [main, feature/oeo-ai-agents]
    paths:
      - 'pilot-sumare/**'
      - '.github/workflows/oeo-pilot-ci.yml'
  pull_request:
    paths:
      - 'pilot-sumare/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot-sumare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pilot-sumare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
